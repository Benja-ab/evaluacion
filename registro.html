<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Novelas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="body-registro">

  <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
    <div class="container">
      <a class="navbar-brand" href="evaluacion.html">← Volver al Inicio</a>
    </div>
  </nav>

  <div class="container my-5">
    <h2 class="text-center mb-4 text-white">Registro </h2>
    
    <form class="mx-auto p-4 rounded form-registro" style="max-width: 500px;">
      <div class="mb-3">
        <label class="form-label text-white">Nombre completo</label>
        <input type="text" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Correo electrónico</label>
        <input type="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Edad</label>
        <input type="number" class="form-control" min="10" max="120">
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Género favorito</label>
        <select class="form-select">
          <option value="">Selecciona...</option>
          <option value="wuxia">Wuxia</option>
          <option value="romance">Romance</option>
          <option value="terror">Terror Apocalíptico</option>
          <option value="fantasia">Fantasía</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Contraseña</label>
        <input type="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-outline-info w-100 mt-3">Registrarse</button>
    </form>
  </div>

</body>
</html>
